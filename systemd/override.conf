# /etc/systemd/system/mihomo@.service.d/override.conf
# mihomo@<user>: run as that user on ~/.config/mihomo (the plugin's files), with
# only the network capabilities TUN needs (the packaged unit runs as root on
# /etc/mihomo with DAC_OVERRIDE, PTRACE and more), and come back by itself
# whenever it exits.
[Unit]
StartLimitIntervalSec=0

[Service]
User=%i
ExecStart=
ExecStart=/usr/bin/mihomo -d /home/%i/.config/mihomo
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
Restart=always
RestartSec=5
